<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>東海大學社團島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#BDE5F4">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D archipelago as the stage — seven category islands around Luce Chapel, joined by bridges; paper-cut HUD cards pinned to the edges. The sky follows the in-game clock, the UI stays paper. */
:root{
  --paper:#FFFDF6;--paper2:#F7F2E4;--ink:#183D3B;--mut:#4F6B69;--line:#E2DCC9;
  --coral:#F28C72;--sun:#F4C95D;--sea:#5FC4D6;--grass:#8FCB8B;--sand:#F3D7A0;
  --shadow:0 5px 0 rgba(24,61,59,.14);
  --f-disp:"Zen Maru Gothic","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Zen Maru Gothic",system-ui,sans-serif;
  --sl:max(12px,env(safe-area-inset-left,0px));--sr:max(12px,env(safe-area-inset-right,0px));
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{background:#BDE5F4;color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:900;margin:0;text-wrap:balance}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
#lbl{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}

/* island signs floating over each island */
.il{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow),0 0 0 2px var(--ink) inset;font:700 15px/1.15 var(--f-disp);white-space:nowrap;will-change:transform;transition:opacity .2s,background .2s;text-align:left}
.il::after{content:"";position:absolute;left:50%;top:100%;width:2.5px;height:16px;background:var(--ink);translate:-50% 0;border-radius:0 0 2px 2px}
.il .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:0 0 0 2px var(--ink) inset;font-size:17px;flex:none}
.il small{display:block;font:500 11.5px/1.2 var(--f-body);color:var(--mut);font-variant-numeric:tabular-nums}
.il .hit{display:inline-block;background:var(--sun);color:var(--ink);border-radius:999px;padding:1px 7px;margin-left:4px;font:700 11px/1.35 var(--f-body);box-shadow:0 0 0 1.5px var(--ink) inset}
.il.sel{background:var(--ink);color:#fff}
.il.sel small{color:#cfe0dc}
.il.dim{opacity:.4}
.il .ic{position:relative}
.il.ch{padding-right:12px;font-size:13.5px}
.il.ch .ic{width:26px;height:26px;font-size:14px}
.il.roll{background:var(--sun)}
.il.sea{font-size:12.5px;padding:3px 10px 3px 3px}
.il.sea::after{height:10px}
#lbl.cmp .il{font-size:12.5px;padding:3px 10px 3px 3px;gap:5px}
#lbl.cmp .il small{display:none}
#lbl.cmp .il .ic{width:24px;height:24px;font-size:13px}
#lbl.cmp .il::after{height:10px}

/* HUD */
.hud{position:fixed;z-index:5}
.card{background:var(--paper);border-radius:20px;box-shadow:var(--shadow),0 0 0 2px var(--ink) inset}
#top{top:calc(var(--st) + 10px);left:var(--sl);right:var(--sr);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;pointer-events:none}
#top>*{pointer-events:auto}
#brand{padding:8px 14px 9px;justify-self:start;display:grid;gap:2px}
#brand small{font-size:11.5px;color:var(--mut);letter-spacing:.04em;line-height:1.2}
#brand h1{font-size:21px;line-height:1.15}
#brand h1 em{font-style:normal;color:var(--coral);-webkit-text-stroke:.4px var(--ink)}
.rbtns{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--f-disp)}
.ib.w{width:auto;padding:0 14px;border-radius:999px;font-size:13px}
#qwrap{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 6px 0 14px;height:42px;border-radius:999px}
#qwrap input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);height:100%;outline:none}
#qwrap input::placeholder{color:var(--mut)}
#qx{width:30px;height:30px;border-radius:50%;background:var(--paper2);font-size:14px}
#chips{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 calc(-1 * var(--sr)) 0 -2px;padding-right:var(--sr)}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;gap:6px;align-items:center;padding:4px 12px 4px 4px;border-radius:999px;background:var(--paper);box-shadow:0 3px 0 rgba(24,61,59,.14),0 0 0 1.5px var(--ink) inset;font:500 13px/1.2 var(--f-body);transition:opacity .2s}
.chip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;box-shadow:0 0 0 1.5px var(--ink) inset}
.chip small{color:var(--mut);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
.chip[aria-pressed="true"] small{color:#cfe0dc}
.chip.off{opacity:.45}
#cnt{grid-column:1/-1;justify-self:start;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff}

#rail{right:var(--sr);top:50%;transform:translateY(-50%);display:grid;gap:10px;justify-items:end;transition:right .2s}
#tools{display:grid;gap:8px;transition:opacity .2s}
.tb{width:52px;padding:7px 0 5px;border-radius:16px;display:grid;justify-items:center;gap:1px;font:500 10.5px/1.2 var(--f-body)}
.tb span{font-size:19px;line-height:1.1}
.tb em{font-style:normal}
.tb[aria-pressed="true"]{background:var(--ink);color:#fff}
#dice{background:var(--coral)}

#bottom{left:var(--sl);right:var(--sr);bottom:calc(var(--sb) + 12px);display:grid;gap:8px;pointer-events:none}
#bottom>*{pointer-events:auto}
#ticker{justify-self:start;max-width:100%;display:flex;gap:8px;align-items:center;padding:6px 14px 6px 10px;border-radius:999px;font-size:13px;overflow:hidden}
#ticker .f{font:700 13px/1 var(--f-disp);flex:none}
#tk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;transition:opacity .25s}
#clock{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;max-width:520px}
#play{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px}
#clock .tt{display:grid;line-height:1.15}
#clock .tt b{font:900 17px/1 var(--f-disp);font-variant-numeric:tabular-nums}
#clock .tt small{font-size:10.5px;color:var(--mut);white-space:nowrap}
#tm{width:100%;accent-color:var(--coral);min-width:0}

nav.tab{display:grid;gap:3px;padding:5px;border-radius:20px;background:var(--coral);box-shadow:var(--shadow),0 0 0 2px var(--ink) inset}
nav.tab button{position:relative;width:52px;padding:6px 0 5px;border-radius:15px;display:grid;justify-items:center;gap:1px;font:500 10.5px/1.2 var(--f-body);color:var(--ink)}
nav.tab button>span{font-size:18px;line-height:1.2}
nav.tab button em{font-style:normal}
nav.tab button[aria-current="page"]{font-weight:700;background:var(--sand);box-shadow:0 0 0 1.5px var(--ink) inset}
nav.tab b{position:absolute;top:2px;right:3px;font:700 10px/1 var(--f-body);background:var(--paper);border-radius:999px;padding:2px 5px;box-shadow:0 0 0 1px var(--ink) inset;font-variant-numeric:tabular-nums}

/* panels */
#panel,#ccard{position:fixed;z-index:7;left:var(--sl);right:var(--sr);bottom:calc(var(--sb) + 12px)}
#panel{max-height:min(60vh,640px);display:flex;flex-direction:column;overflow:hidden}
#panel header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px 8px 18px}
#panel header h2{font-size:22px;display:flex;align-items:center;gap:10px}
#panel header h2 .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:0 0 0 2px var(--ink) inset;font-size:21px;flex:none}
#panel header h2 small{display:block;font:500 12.5px/1.3 var(--f-body);color:var(--mut)}
#pbody{overflow:auto;padding:0 12px 16px;user-select:text;overscroll-behavior:contain}
.x{width:36px;height:36px;border-radius:50%;background:var(--paper2);font-size:16px;flex:none}
.tagl{margin:0 6px 10px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 26%,var(--paper));font-size:14px}
.grp h3{font-size:15px;padding:12px 6px 6px;display:flex;gap:6px;align-items:center}
.grp h3 button{display:flex;gap:6px;align-items:center;font:inherit}
.grp h4{font:700 12px/1.3 var(--f-body);color:var(--mut);margin:8px 6px 4px;letter-spacing:.04em}
ul.rows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.rows li{position:relative;display:flex;background:var(--paper2);border-radius:14px;border-left:7px solid var(--c)}
.row{flex:1;min-width:0;text-align:left;padding:8px 48px 8px 12px;display:block}
.row b{display:block;font-weight:500;font-size:15.5px;line-height:1.35}
.row small{display:block;color:var(--mut);font-size:12.5px;line-height:1.35;overflow-wrap:anywhere}
.row b .ok{color:#2E8B57;font-size:12px;margin-left:6px;font-weight:700}
.heart{position:absolute;right:2px;top:50%;translate:0 -50%;width:44px;height:44px;font-size:20px;color:var(--mut)}
.heart[aria-pressed="true"]{color:var(--coral)}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.face{font:900 34px/1 var(--f-disp)}
.prog{display:grid;gap:10px;margin:4px 6px 10px}
.pr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px;text-align:left;width:100%;padding:2px 0}
.pr .bar{height:12px;border-radius:999px;background:var(--paper2);box-shadow:0 0 0 1.5px var(--ink) inset;overflow:hidden}
.pr .bar i{display:block;height:100%;background:var(--c);border-right:1.5px solid var(--ink)}
.pr .bar i[style*="width:0%"]{border:0}
.pr small{font-variant-numeric:tabular-nums;color:var(--mut);min-width:3.5em;text-align:right}
.big{display:flex;align-items:baseline;gap:8px;margin:2px 6px 12px}
.big b{font:900 40px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.big span{color:var(--mut)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.log li button{width:100%;display:grid;grid-template-columns:auto 1fr;gap:10px;text-align:left;padding:6px 8px;border-radius:10px;font-size:14px}
.log li button:hover{background:var(--paper2)}
.log time{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border-radius:999px;padding:9px 16px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.g{background:var(--paper);color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.btn.c{background:var(--coral);color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.foot{color:var(--mut);font-size:12.5px;margin:16px 6px 0}
.foot a{color:var(--ink)}
#ccard{padding:16px 16px 16px 18px;max-width:520px}
#ccard .x{position:absolute;right:10px;top:10px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;padding:2px 10px 2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 32%,var(--paper));box-shadow:0 0 0 1.5px var(--ink) inset}
#ck{font:700 13px/1 var(--f-disp);color:var(--coral);margin:0 0 6px}
#ccard h2{font-size:24px;line-height:1.25;margin:8px 44px 2px 0}
#ccard .en{color:var(--mut);margin:0;font-size:13.5px}
.status{margin:10px 0 0;font-size:13.5px;display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:12px;background:var(--paper2)}
.status.ok{background:color-mix(in srgb,var(--sun) 40%,var(--paper))}
.note{font-size:12.5px;color:var(--mut);margin:8px 0 0}

#toast{position:fixed;z-index:9;left:50%;top:calc(var(--st) + 150px);translate:-50% 0;padding:10px 16px;border-radius:16px;font-weight:700;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s,transform .25s;opacity:0;transform:translateY(-8px);pointer-events:none}
#toast.on{opacity:1;transform:none}
.cf{position:fixed;z-index:10;pointer-events:none;font-size:22px;left:50%;top:40%}

#splash{position:fixed;inset:0;z-index:20;background:#BDE5F4;display:grid;place-content:center;text-align:center;gap:6px;transition:opacity .5s}
#splash .face{font-size:56px}
#splash.out{opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
#splash p{font:700 16px/1.4 var(--f-disp);margin:0}
#nogl{position:fixed;z-index:4;left:var(--sl);right:var(--sr);top:40%;padding:16px;text-align:center}

dialog{border:0;padding:0;background:var(--paper);color:var(--ink);border-radius:26px;width:min(400px,90vw);box-shadow:var(--shadow),0 0 0 2px var(--ink) inset}
dialog::backdrop{background:rgba(24,61,59,.55)}
.din{padding:22px 22px 20px}
.din h2{font-size:24px;line-height:1.3;margin:8px 0 6px}
.din p{margin:0}
.dots{display:flex;gap:6px;margin-top:14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}

@media(min-width:900px){
  #top{grid-template-columns:auto minmax(260px,420px) 1fr auto;column-gap:12px}
  #brand{grid-column:1;grid-row:1}
  #qwrap{grid-column:2;grid-row:1;align-self:start;margin-top:6px}
  .rbtns{grid-column:4;grid-row:1}
  #chips{grid-column:1/-1;grid-row:2;margin:0;padding-right:0}
  #cnt{grid-row:3}
  #panel{left:auto;width:400px;top:calc(var(--st) + 150px);bottom:calc(var(--sb) + 16px);max-height:none}
  #ccard{left:calc(var(--sl) + 4px);bottom:calc(var(--sb) + 120px);width:420px}
  #bottom{right:auto;width:min(560px,calc(100% - 120px))}
  body.paneled #rail{right:calc(var(--sr) + 412px)}
}
@media(max-width:899px){
  /* phones: the rail sits below the header; while a panel or card is open only the menu stays, and the panel stops short of it */
  #rail{top:calc(var(--st) + 200px);transform:none}
  body.carded #tools,body.paneled #tools{opacity:0;pointer-events:none}
  body.paneled #bottom,body.carded #bottom{visibility:hidden}
  nav.tab button{width:44px;padding:8px 0}
  nav.tab button em{font-size:0;line-height:0}
  nav.tab b{top:-2px;right:-3px}
  #panel{max-height:max(220px,min(60vh,calc(100% - var(--st) - 396px)))}
  #bottom{right:calc(var(--sr) + 66px)}
}
@media(max-width:380px){#brand h1{font-size:18px}.tb{width:46px}#clock .tt small{display:none}.il{font-size:13.5px}}
@media(hover:hover){.chip:hover,.tb:hover,.ib:hover{filter:brightness(.97)}.row:hover b{text-decoration:underline}.il:hover{filter:brightness(.97)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

<div id="stage" aria-label="3D 社團群島地圖"></div>
<div id="lbl"></div>

<div id="splash"><div class="face">•ᴗ•</div><p data-k="splash">正在搭橋，連起七座社團島…</p></div>

<div class="hud" id="top">
  <div class="card" id="brand">
    <small id="sem"></small>
    <h1 id="ttl"></h1>
  </div>
  <div class="rbtns">
    <button class="ib card" id="music" aria-pressed="true" aria-label="關閉背景音樂">🔊</button>
    <button class="ib w card langbtn" aria-label="Language / 語言">EN</button>
    <button class="ib card" id="help" aria-label="使用說明">?</button>
  </div>
  <label class="card" id="qwrap"><span aria-hidden="true">⌕</span><input id="q" type="search" autocomplete="off" placeholder="搜尋社團，中英文都可以"><button id="qx" type="button" hidden aria-label="清除">✕</button></label>
  <div id="chips" role="toolbar" aria-label="小島"></div>
  <div id="cnt" hidden aria-live="polite"></div>
</div>

<!-- right-hand rail: main menu on top, map tools below — floats over the map instead of a full-width bottom bar -->
<div class="hud" id="rail">
  <nav class="tab" aria-label="主選單">
    <button data-v="map" aria-current="page"><span>🗺</span><em data-k="nav_map">群島</em></button>
    <button data-v="list"><span>☰</span><em data-k="nav_list">清單</em></button>
    <button data-v="fav"><span>♥</span><em><i data-k="nav_fav" style="font-style:normal">收藏</i><b id="fn">0</b></em></button>
  </nav>
  <div id="tools">
    <button class="tb card" id="dice"><span>🎲</span><em data-k="t_dice">抽一個</em></button>
    <button class="tb card" id="bird" aria-pressed="false"><span>🛰</span><em data-k="t_bird">鳥瞰</em></button>
    <button class="tb card" id="home"><span>⌂</span><em data-k="t_home">全景</em></button>
  </div>
</div>

<div class="hud" id="bottom">
  <div class="card" id="ticker"><span class="f">•ᴗ•</span><span id="tk"></span></div>
  <div class="card" id="clock">
    <button id="play" aria-label="播放一天">▶</button>
    <div class="tt"><b id="tv">08:00</b><small data-k="day">東海人的一天</small></div>
    <input id="tm" type="range" min="360" max="1439" step="5" value="480" aria-label="時間">
  </div>
</div>

<div class="card" id="ccard" hidden>
  <button class="x" data-close="card" aria-label="關閉">✕</button>
  <p id="ck" hidden></p>
  <div id="cb"></div>
  <div class="acts">
    <a class="btn" id="cl" target="_blank" rel="noopener"></a>
    <button class="btn g" id="cf"></button>
  </div>
</div>

<section class="card" id="panel" hidden aria-live="polite">
  <header><h2 id="ph"></h2><button class="x" data-close="panel" aria-label="關閉">✕</button></header>
  <div id="pbody"></div>
</section>

<div class="card" id="toast" role="status"></div>
<div class="card" id="nogl" hidden></div>


<dialog id="tour"><div class="din">
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="face">•ᴗ•</div><button class="btn g langbtn" style="padding:6px 12px">EN</button></div>
  <h2 id="th"></h2><p id="tp"></p>
  <div class="dots" id="tdots"><i></i><i></i><i></i></div>
  <div class="acts" style="justify-content:flex-end"><button class="btn g" id="skip" data-k="skip">略過</button><button class="btn" id="next">下一步 →</button></div>

function applyTime(h){hour=h;const hh=Math.floor(h),mm=Math.round((h-hh)*60);$('tv').textContent=`${String(hh).padStart(2,'0')}:${String(mm%60).padStart(2,'0')}`;
  if(!ok3d)return;let i=0;while(i<KF.length-2&&KF[i+1][0]<=h)i++;const a=KF[i],b=KF[i+1],k=(h-a[0])/(b[0]-a[0]);
  const sky=C(a[1]).lerp(C(b[1]),k),sun=C(a[2]).lerp(C(b[2]),k),si=a[3]+(b[3]-a[3])*k,am=a[4]+(b[4]-a[4])*k,wat=C(a[5]).lerp(C(b[5]),k),glow=a[6]+(b[6]-a[6])*k;
  scene.background=sky;world.sun.color.copy(sun);world.sun.intensity=si;world.hemi.intensity=am;world.hemi.color.copy(C('#ffffff').lerp(sky,.35));world.water.material.color.copy(wat);
  world.MT.shallow.color.copy(wat).lerp(C('#ffffff'),.4*(1-glow*.75));world.MT.foam.color.copy(C('#ffffff').lerp(wat,glow*.5));
  const day=h>=6&&h<=19.5;const ang=day?((h-6)/13.5)*Math.PI:Math.PI*.35;world.sun.position.set(Math.cos(ang)*-30+8,Math.max(10,Math.sin(ang)*40),day?18:-20);
  world.MT.win.color.copy(C('#4E6470').lerp(C('#FFD27A'),glow));world.glowDiscs.forEach(m=>m.opacity=.06+glow*.42);world.MT.glass.emissive.copy(C('#000000').lerp(C('#E9A74A'),glow*.55));
  world.clouds.forEach(c=>c.children.forEach(s=>s.material.color.copy(C('#ffffff').lerp(sky,.45))));
  document.querySelector('meta[name=theme-color]').content='#'+sky.getHexString();
  $('splash').style.background='#'+sky.getHexString()}
let playing=false,lastEv=-1;
function tm2h(){return +$('tm').value/60}
$('tm').oninput=()=>{applyTime(tm2h());evCheck()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'❚❚':'▶'};
function evCheck(){const ev=tx('events');let j=-1;ev.forEach((e,i)=>{if(hour>=e[0])j=i});if(j!==lastEv){lastEv=j;if(j>=0)tick(ev[j][1],5)}}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function hit(cx,cy){ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const hs=ray.intersectObjects(pick,true);
  for(const h of hs){let o=h.object;while(o){if(o.userData.club)return{club:o.userData.club};if(o.userData.chapel)return{chapel:1};if(o.userData.isle!=null)return{isle:ISLES[o.userData.isle]};o=o.parent}}return null}
let down=null;
if(ok3d){const el=renderer.domElement;
  el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()}});
  el.addEventListener('pointerup',e=>{if(!down)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y),dt=performance.now()-down.t;down=null;if(d>7||dt>600)return;
    const h=hit(e.clientX,e.clientY);if(!h)return;if(h.club)select(h.club);else if(h.chapel)goChapel();else if(h.isle)selectIsle(h.isle)});
  el.addEventListener('pointercancel',()=>down=null);
  let hv=0;el.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons)return;const n=performance.now();if(n-hv<60)return;hv=n;el.style.cursor=hit(e.clientX,e.clientY)?'pointer':'grab'});
}
addEventListener('keydown',e=>{if(e.key==='Escape'){if(cur)deselect();else closePanel()}});

/* ---------- chips, search, dice ---------- */
function renderChips(){$('chips').innerHTML=ISLES.map(d=>{const [col,ic]=sty(d.c),h=q?d.L.filter(ok).length:d.L.length;
  return `<button class="chip${q&&!h?' off':''}" data-isle="${d.i}" aria-pressed="${curIsle===d}"><i style="background:${col}">${ic}</i>${E(isn(d.c))}<small>${h}</small></button>`}).join('')}
function updCount(){const n=CLUBS.filter(ok).length;$('cnt').hidden=!q;$('cnt').textContent=tx('lit')(n)}
$('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();$('qx').hidden=!q;renderChips();updCount();buildLabels();if(view==='list'||view==='isle')renderPanel();
  if(q){const hits=ISLES.filter(d=>d.L.some(ok));if(hits.length===1&&view==='map')focus(hits[0].x,hits[0].z,isleZoom(hits[0]))}});
$('qx').onclick=()=>{$('q').value='';$('q').dispatchEvent(new Event('input'));$('q').focus()};
let rolling=false;
$('dice').onclick=()=>{if(rolling)return;const L=CLUBS.filter(ok);if(!L.length){toast(tx('none'));return}const f=L[Math.random()*L.length|0];
  if(RM||!ok3d){select(f,{dice:true});return}
  if(cur)deselect();rolling=true;let n=0;const id=setInterval(()=>{iEls.forEach(t=>t.el.classList.remove('roll'));const d=n>=11?isleOf(f):ISLES[Math.random()*NI|0];const t=iEls.find(t=>t.d===d);t&&t.el.classList.add('roll');
    if(++n>12){clearInterval(id);rolling=false;setTimeout(()=>select(f,{dice:true}),250)}},110)};
$('bird').onclick=()=>{bird=!bird;$('bird').setAttribute('aria-pressed',bird);flyTo(bird?{phi:.03}:{phi:HOME.phi})};
$('home').onclick=()=>{if(cur)deselect();closePanel();curIsle=null;renderChips();buildLabels();updSel();goHome()};

/* ---------- panels ---------- */
const heart=z=>`<button class="heart" data-f="${E(z)}" aria-pressed="${fav.has(z)}" aria-label="${E(tx('save'))} ${E(nm(by[z]))}">${fav.has(z)?'♥':'♡'}</button>`;
const row=x=>`<li style="--c:${sty(x.c)[0]}"><button class="row" data-z="${E(x.zh)}"><b>${E(nm(x))}</b><small>${E(nm2(x))}</small></button>${heart(x.zh)}</li>`;
const rowsOf=L=>{if(L.some(x=>x.g)){const gs=[...new Set(L.map(x=>x.g||''))];return gs.map(g=>`<h4>${g?E(gn(g)):tx('other')}</h4><ul class="rows">${L.filter(x=>(x.g||'')===g).map(row).join('')}</ul>`).join('')}return`<ul class="rows">${L.map(row).join('')}</ul>`};
function renderPanel(){const b=$('pbody');$('panel').style.removeProperty('--c');
  if(view==='isle'&&curIsle){const d=curIsle,[col,ic]=sty(d.c),L=d.L.filter(ok);
    $('panel').style.setProperty('--c',col);
    $('ph').innerHTML=`<span class="ic">${ic}</span><span>${E(isn(d.c))}<small>${E(cn(d.c))} · ${tx('clubs')(d.L.length)}</small></span>`;
    b.innerHTML=`<p class="tagl">${E(tagl(d.c))}</p>
      ${L.length?rowsOf(L):`<p class="empty">${tx('none')}</p>`}`}
  if(view==='list'){$('ph').textContent=tx('listh');const h=ISLES.map(d=>{const L=d.L.filter(ok);if(!L.length)return'';
      return`<section class="grp" style="--c:${sty(d.c)[0]}"><h3><button data-isle="${d.i}">${sty(d.c)[1]} ${E(isn(d.c))}</button></h3>${rowsOf(L)}</section>`}).join('');
    b.innerHTML=(h||`<p class="empty">${tx('none')}</p>`)+`<p class="foot">${tx('foot')(CLUBS.length)}</p>`}
  if(view==='fav'){$('ph').textContent=tx('favh');const L=[...fav].map(z=>by[z]).filter(Boolean);
    b.innerHTML=L.length?`<p style="margin:0 6px 10px;color:var(--mut)">${tx('favp')}</p><ul class="rows">${L.map(row).join('')}</ul><div class="acts"><button class="btn" id="copy">${tx('copy')}</button></div><textarea id="copyT" hidden readonly style="width:100%;margin-top:10px;height:120px;font:inherit"></textarea>`:`<div class="empty"><div class="face">•ᴗ•</div><p>${tx('fave')}</p></div>`}}
function setNav(){const v=view==='isle'?'map':view;document.querySelectorAll('nav.tab button').forEach(b=>b.dataset.v===v?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'))}
function go(v){if(v==='map'){if(cur)deselect();closePanel();return}
  view=v;setNav();if(isMob()){$('ccard').hidden=true;document.body.classList.remove('carded')}$('panel').hidden=false;document.body.classList.add('paneled');renderPanel();$('pbody').scrollTop=0}
function closePanel(){$('panel').hidden=true;document.body.classList.remove('paneled');if(view!=='map'){if(view==='isle'){curIsle=cur?curIsle:null;renderChips();buildLabels();updSel()}view='map';setNav()}}
document.querySelector('nav.tab').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v===view&&view!=='map'){closePanel();return}go(b.dataset.v)});
document.addEventListener('click',async e=>{const T=e.target;let b;
  if(b=T.closest('[data-close]')){b.dataset.close==='card'?deselect():(ok3d?closePanel():0)}
  else if(b=T.closest('.heart')){const z=b.dataset.f;fav.has(z)?fav.delete(z):fav.add(z);saveFav();if(view==='fav')renderPanel();else{b.setAttribute('aria-pressed',fav.has(z));b.textContent=fav.has(z)?'♥':'♡'}if(cur&&cur.zh===z)renderCard()}
  else if(b=T.closest('[data-z]')){const x=by[b.dataset.z];if(x)select(x)}
  else if(b=T.closest('[data-isle]')){const d=ISLES[+b.dataset.isle];if(d){if(cur)deselect();selectIsle(d)}}
  else if(T.closest('#copy')){const txt=tx('copyhdr')+[...fav].map(z=>nm(by[z])).join('\n');try{await navigator.clipboard.writeText(txt);$('copy').textContent=tx('copied')}catch(err){const ta=$('copyT');ta.hidden=false;ta.value=txt;ta.focus();ta.select();$('copy').textContent=tx('copyfail')}}});
$('cf').onclick=()=>{const z=cur.zh;fav.has(z)?fav.delete(z):fav.add(z);saveFav();renderCard();if(view!=='map')renderPanel()};

/* ---------- tour ---------- */
let si=0;const step=()=>{const st=tx('steps')(CLUBS.length);$('th').textContent=st[si][0];$('tp').textContent=st[si][1];$('next').textContent=si<2?tx('next'):tx('go');[...$('tdots').children].forEach((d,i)=>d.classList.toggle('on',i===si))};
const endTour=()=>{$('tour').close();LS.set('club-tour-isles','1')};
$('next').onclick=()=>{si<2?(si++,step()):endTour()};$('skip').onclick=endTour;
$('help').onclick=()=>{si=0;step();$('tour').showModal()};

/* ---------- language ---------- */
function applyLang(){const e=LG==='en';document.documentElement.lang=e?'en':'zh-Hant';document.title=tx('title');
  document.querySelectorAll('[data-k]').forEach(n=>n.textContent=tx(n.dataset.k));
  $('ttl').innerHTML=tx('h1');$('q').placeholder=tx('ph');$('q').setAttribute('aria-label',tx('ph'));
  document.querySelectorAll('.langbtn').forEach(b=>b.textContent=e?'中文':'EN');BGM.ui();
  $('sem').textContent=tx('sem')(SY,STm);renderChips();updCount();step();buildLabels();if(ok3d)world.redrawSigns();if(cur)renderCard();if(view!=='map')renderPanel();lastEv=-1;evCheck()}
document.addEventListener('click',e=>{if(e.target.closest('.langbtn')){LG=LG==='en'?'zh':'en';LS.set('club-lang',LG);applyLang()}});

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);if(document.hidden)return;const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing){let m=+$('tm').value+dt*36;if(m>1439)m=360;$('tm').value=m;applyTime(m/60);evCheck()}
  stepTween(now);if(!tw)controls.update();
  stepWalk(dt);
  if(!RM){const t=now/1000;world.MT.foam.opacity=.45+Math.sin(t*1.4)*.2;
    world.waveData.forEach((d,i)=>{tmpM.compose(tmpV.set(d.x+Math.sin(t*.3+d.p)*.4,.02,d.z),tmpQ.setFromEuler(tmpE.set(0,.6,0)),tmpS.setScalar(.5+.5*Math.sin(t*d.s+d.p)));world.waves.setMatrixAt(i,tmpM)});world.waves.instanceMatrix.needsUpdate=true;
    const ba=t*.03,br=WORLD_R+2;world.boat.position.set(Math.cos(ba)*br,Math.sin(t*2)*.04,Math.sin(ba)*br);world.boat.rotation.set(Math.sin(t*1.7)*.05,-ba,0);
    world.clouds.forEach((c,i)=>{c.position.x+=dt*(.35+i*.05);if(c.position.x>WORLD_R*1.3)c.position.x=-WORLD_R*1.3});
    world.seaTick(t);
    world.anims.forEach(f=>f(t));
    (world.fires||[]).forEach((f,i)=>{f.scale.set(1,1+Math.sin(t*9+i*2)*.15,1)});
    if(world.sel.visible){world.sel.material.opacity=.55+Math.sin(t*3)*.35}}
  renderer.render(scene,camera);placeLabels()}

/* ---------- background music: Fortaleza (Topher Mohr and Alex Elena), looped at 50% volume ----------
   The page tries to start it straight away; browsers that block sound before interaction get it on the first tap or key press. 🔊/🔇 toggles it, remembered on this device. */
const BGM=(()=>{const a=new Audio('bgm.mp3');a.loop=true;a.volume=.5;a.preload='auto';
  let on=LS.get('club-music','on')!=='off',hinted=false;
  const ui=()=>{const b=$('music');if(!b)return;b.textContent=on?'🔊':'🔇';b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?tx('music_off'):tx('music_on'));b.title=b.getAttribute('aria-label')};
  const play=()=>{if(!on||!a.paused)return;a.play().then(()=>{if(!hinted){hinted=true;tick(tx('music_hint'),5)}}).catch(()=>{})};
  const first=e=>{if(e.target&&e.target.closest&&e.target.closest('#music'))return;play();if(!on||!a.paused){removeEventListener('pointerdown',first,true);removeEventListener('keydown',first,true)}};
  addEventListener('pointerdown',first,true);addEventListener('keydown',first,true);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)a.pause();else play()});
  function toggle(){on=!on;LS.set('club-music',on?'on':'off');if(on)play();else a.pause();ui();toast(on?tx('music_is_on'):tx('music_is_off'),1600)}
  play();return {toggle,ui}})();
$('music').onclick=()=>BGM.toggle();

/* ---------- boot ---------- */
saveFav();
const now=new Date();let h0=now.getHours()+now.getMinutes()/60;if(h0<6)h0=23;
$('tm').value=Math.round(h0*60/5)*5;
if(ok3d){resize();
  sph.set(80,HOME.phi,HOME.theta);camera.position.setFromSpherical(sph);camera.lookAt(0,0,0);camera.zoom=1;camera.updateProjectionMatrix();controls.update();
  if(!RM){camera.zoom=.78;camera.updateProjectionMatrix();sph.set(80,1.12,HOME.theta-.9);camera.position.setFromSpherical(sph);controls.update();setTimeout(()=>flyTo({t:homeT(),phi:HOME.phi,theta:HOME.theta,zoom:1,d:1600}),350)}else{const t=homeT();controls.target.set(t.x,0,t.z);camera.position.add(new V3(t.x,0,t.z));controls.update()}
  world.av.position.copy(avPos);world.anims.forEach(f=>f(0));
  applyTime(tm2h());
  requestAnimationFrame(loop);
}else{$('nogl').hidden=false;$('nogl').textContent='這台裝置無法顯示 3D 群島，先用清單瀏覽所有社團。';$('tools').hidden=true;$('clock').hidden=true;applyTime(tm2h())}
applyLang();
tick(tx('tips')[0],6);
setTimeout(()=>$('splash').classList.add('out'),RM?0:700);
if(!ok3d)go('list');
if(!LS.get('club-tour-isles',''))setTimeout(()=>$('help').click(),RM?300:2300);
</script>
</body></html>
